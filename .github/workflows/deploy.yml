name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build with Vite
        run: npm run build
        env:
          VITE_BASE_PATH: '/Blooming-wellness/'

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || { echo "CRITICAL ERROR: dist/index.html is missing!"; exit 1; }
          test -f dist/404.html || { echo "CRITICAL ERROR: dist/404.html is missing!"; exit 1; }
          ls -la dist/assets/*.js || { echo "CRITICAL ERROR: No compiled JS bundles found in dist/assets!"; exit 1; }
          ls -la dist/assets/*.css || { echo "CRITICAL ERROR: No compiled CSS bundles found in dist/assets!"; exit 1; }
          echo "Verification SUCCESS: All production HTML, JS, and CSS artifacts are present."

      - name: Setup Pages configuration
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
