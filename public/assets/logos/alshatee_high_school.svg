<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%" height="100%">
  <!-- Al-Shatee High School Official School Crest & Clean Typography -->
  <g fill="none" stroke="none">
    <!-- School Crest Shield / Circle -->
    <g transform="translate(15, 10)">
      <!-- Outer circle/ring in deep teal -->
      <circle cx="50" cy="50" r="45" stroke="#134e5e" stroke-width="2.5" fill="#f8fcfe"/>
      <circle cx="50" cy="50" r="40" stroke="#389eb3" stroke-width="1.2" stroke-dasharray="3,2"/>
      
      <!-- Open Book of Learning -->
      <path d="M 32 58 Q 50 50 50 63 Q 50 50 68 58 L 68 40 Q 50 32 50 45 Q 50 32 32 40 Z" fill="#134e5e"/>
      <path d="M 50 45 L 50 63" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Coast / Waves symbolizing Al-Shatee -->
      <path d="M 28 72 Q 38 66 50 72 Q 62 78 72 72 L 72 78 Q 62 84 50 78 Q 38 72 28 78 Z" fill="#389eb3"/>
      <path d="M 32 79 Q 42 75 50 79 Q 58 83 68 79" stroke="#84d2ea" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Pen / Torch / Star of Excellence at top -->
      <polygon points="50,22 53,29 60,30 55,35 56,42 50,38 44,42 45,35 40,30 47,29" fill="#ea8c38"/>
    </g>

    <!-- Divider Line -->
    <line x1="125" y1="20" x2="125" y2="100" stroke="#d6e6eb" stroke-width="1.5" stroke-linecap="round"/>

    <!-- School Typography -->
    <text x="145" y="46" font-family="'Cairo', system-ui, sans-serif" font-weight="800" font-size="20" fill="#134e5e" text-anchor="start">
      ثانوية الشاطئ
    </text>
    <text x="145" y="68" font-family="'Cairo', system-ui, sans-serif" font-weight="600" font-size="12" fill="#267d8f" text-anchor="start">
      Al-Shatee High School
    </text>
    <text x="145" y="88" font-family="'Cairo', system-ui, sans-serif" font-weight="500" font-size="10" fill="#55727d" text-anchor="start">
      تعليم متميز.. وبيئة مدرسية معززة للصحة
    </text>
  </g>
</svg>
