<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%" height="100%">
  <!-- Saudi Ministry of Education Official Emblem Emblem + Clean Typography -->
  <g fill="none" stroke="none">
    <!-- Center Dot Group (The Iconic Tree of Knowledge Dots) -->
    <g transform="translate(15, 8)">
      <!-- Row 1 -->
      <circle cx="45" cy="18" r="4.2" fill="#1b6b55"/>
      <circle cx="58" cy="18" r="4.2" fill="#1ea678"/>
      
      <!-- Row 2 -->
      <circle cx="34" cy="29" r="4.8" fill="#1b6b55"/>
      <circle cx="48" cy="28" r="5.2" fill="#138260"/>
      <circle cx="62" cy="28" r="5.2" fill="#1ea678"/>
      <circle cx="76" cy="29" r="4.8" fill="#24c28d"/>
      
      <!-- Row 3 -->
      <circle cx="25" cy="42" r="5.2" fill="#185644"/>
      <circle cx="40" cy="41" r="5.8" fill="#138260"/>
      <circle cx="55" cy="40" r="6.2" fill="#1ea678"/>
      <circle cx="70" cy="41" r="5.8" fill="#24c28d"/>
      <circle cx="85" cy="42" r="5.2" fill="#42dba6"/>
      
      <!-- Row 4 -->
      <circle cx="18" cy="57" r="5.5" fill="#185644"/>
      <circle cx="33" cy="56" r="6.2" fill="#138260"/>
      <circle cx="48" cy="55" r="6.5" fill="#1ea678"/>
      <circle cx="62" cy="55" r="6.5" fill="#24c28d"/>
      <circle cx="77" cy="56" r="6.2" fill="#42dba6"/>
      <circle cx="92" cy="57" r="5.5" fill="#5ee3b5"/>

      <!-- Base central trunk dots -->
      <circle cx="55" cy="69" r="5.8" fill="#138260"/>
      <circle cx="55" cy="82" r="5.2" fill="#185644"/>
      <circle cx="55" cy="94" r="4.5" fill="#113e31"/>
    </g>

    <!-- Divider Line -->
    <line x1="125" y1="20" x2="125" y2="100" stroke="#d5e5e0" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Official Arabic Typography -->
    <text x="145" y="48" font-family="'Cairo', system-ui, sans-serif" font-weight="800" font-size="21" fill="#0f4435" text-anchor="start">
      وزارة التعليم
    </text>
    <text x="145" y="70" font-family="'Cairo', system-ui, sans-serif" font-weight="600" font-size="12" fill="#1b6b55" text-anchor="start">
      Ministry of Education
    </text>
    <text x="145" y="88" font-family="'Cairo', system-ui, sans-serif" font-weight="500" font-size="9.5" fill="#52786d" text-anchor="start">
      المملكة العربية السعودية
    </text>
  </g>
</svg>
